<!doctype html><title>sgm gemm bench</title><pre id="log"></pre>
<script type="module">
// Prefill GEMM kernels on their own (no model): the f32 row-stationary GEMM, its f16-operand twin
// (prefillMath "f16") and, where Chrome exposes chromium-experimental-subgroup-matrix, the tensor-core
// GEMM (prefillMath "sgmatrix"), on the 27B shapes at 16 columns. Reports ms / TFLOPS per shape and
// the relative L2 difference of each variant from the f32 GEMM. Driver: node tests/bench/sgm_gemm.mjs
// Query: ?reps=20&sgm={"TM":128,"KB":1,"PAD":8}&q8=1 (also the Q8_0 kernels)
import { WGSL, coopWGSL } from "../../engine/engine.js";
import { gemmWGSL, GEMM_S, GEMM_TILE } from "../../engine/wgsl/gemm.js";
import { gemmSgmWGSL, pickSgmConfig, SGM_DEFAULT, SGM_FEATURES, SGM_FEATURES_OPT, SGM_SYNTAX } from "../../engine/wgsl/gemm_sgm.js";
import { f32ToF16 } from "../../engine/gguf.js";
const q = new URLSearchParams(location.search), REPS = +(q.get("reps") || 20), Q8 = q.get("q8") === "1";
const T = { ...SGM_DEFAULT, ...(q.get("sgm") ? JSON.parse(q.get("sgm")) : {}) };
const log = (s) => { document.getElementById("log").textContent += s + "\n"; console.log(s); };
const N = 16;
try {
  const ad = await navigator.gpu.requestAdapter();
  const feats = SGM_FEATURES.filter((f) => ad.features.has(f));
  const device = await ad.requestDevice({ requiredFeatures: [...feats, ...SGM_FEATURES_OPT.filter((f) => ad.features.has(f))], requiredLimits: { maxBufferSize: ad.limits.maxBufferSize,
    maxStorageBufferBindingSize: ad.limits.maxStorageBufferBindingSize, maxComputeWorkgroupStorageSize: ad.limits.maxComputeWorkgroupStorageSize } });
  const errs = []; device.addEventListener("uncapturederror", (e) => errs.push(e.error?.message));
  log(`adapter ${ad.info?.vendor} ${ad.info?.architecture}; features ${feats.join(", ") || "(none of " + SGM_FEATURES.join(", ") + ")"}; subgroup ${ad.info?.subgroupMinSize}..${ad.info?.subgroupMaxSize}`);
  log(`subgroupMatrixConfigs ${JSON.stringify([...(ad.info?.subgroupMatrixConfigs || [])].map((c) => [c.componentType, c.resultComponentType, c.M, c.N, c.K]))}`);
  const SH = ["17408x5120", "5120x17408", "5120x6144", "10240x5120", "6144x5120", "1024x5120"];
  const pairs = [...new Set(SH.map((s) => `${s.split("x")[1]}:${GEMM_S[s]}`))].map((x) => x.split(":").map(Number));
  const main = device.createShaderModule({ code: WGSL + coopWGSL(256, 4, 64, N, 1, true) + gemmWGSL({ N, pairs, pairs8: Q8 ? pairs : [], UNPACK: true, R16: true }) });
  const mi = (await main.getCompilationInfo()).messages.filter((m) => m.type === "error");
  if (mi.length) throw new Error("main module: " + mi[0].message);
  const { cfg, why } = pickSgmConfig(ad.info, { N, TM: T.TM, KB: T.KB });
  let sgmMod = null;
  if (feats.length === SGM_FEATURES.length && cfg) {
    for (const syntax of SGM_SYNTAX) {
      const m = device.createShaderModule({ code: gemmSgmWGSL({ N, ...T, cfg, pairs, pairs8: Q8 ? pairs : [], syntax }) });
      const si = (await m.getCompilationInfo()).messages.filter((x) => x.type === "error");
      if (si.length) { log(`sgm module (${syntax} builtins) does not compile: L${si[0].lineNum}: ${si[0].message}`); continue; }
      sgmMod = m; log(`sgm: ${syntax} builtins, MMA ${cfg.M}x${cfg.Nm}x${cfg.Kc}, workgroup ${cfg.SG}, ${JSON.stringify(T)}${why ? " (" + why + ")" : ""}`); break;
    }
  } else log(`sgm unavailable: ${feats.length < SGM_FEATURES.length ? "features missing (Chrome with --enable-unsafe-webgpu)" : why}`);

  const C = GPUShaderStage.COMPUTE, S = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC, U = GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST;
  const l0 = device.createBindGroupLayout({ entries: [0, 1].map((b) => ({ binding: b, visibility: C, buffer: { type: "uniform" } })) });
  const l1 = device.createBindGroupLayout({ entries: ["read-only-storage", "read-only-storage", "read-only-storage", "storage", "uniform"].map((t, i) => ({ binding: i, visibility: C, buffer: { type: t } })) });
  const layout = device.createPipelineLayout({ bindGroupLayouts: [l0, l1] });
  const pipe = (mod, entryPoint) => device.createComputePipelineAsync({ layout, compute: { module: mod, entryPoint } });
  const buf = (d, usage = S) => { const b = device.createBuffer({ size: Math.max(16, d.byteLength), usage }); device.queue.writeBuffer(b, 0, d); return b; };
  const bg0 = device.createBindGroup({ layout: l0, entries: [buf(new Uint32Array(12), U), buf(new Uint32Array(4), U)].map((b, i) => ({ binding: i, resource: { buffer: b } })) });
  const bg1 = (...bs) => device.createBindGroup({ layout: l1, entries: bs.map((b, i) => ({ binding: i, resource: { buffer: b } })) });
  const disp = (ps, p, bg, wgs) => { ps.setPipeline(p); ps.setBindGroup(0, bg0); ps.setBindGroup(1, bg); if (wgs > 32768) ps.dispatchWorkgroups(32768, Math.ceil(wgs / 32768)); else ps.dispatchWorkgroups(wgs); };
  const time = async (steps) => {   // wall time per rep of a list of [pipe, bg, wgs], REPS reps in one submit
    const e0 = device.createCommandEncoder(); { const ps = e0.beginComputePass(); for (const s of steps) disp(ps, ...s); ps.end(); }
    device.queue.submit([e0.finish()]); await device.queue.onSubmittedWorkDone();
    const t0 = performance.now(), e = device.createCommandEncoder(), ps = e.beginComputePass();
    for (let r = 0; r < REPS; r++) for (const s of steps) disp(ps, ...s);
    ps.end(); device.queue.submit([e.finish()]); await device.queue.onSubmittedWorkDone();
    return (performance.now() - t0) / REPS;
  };
  const read = async (b, n) => { const st = device.createBuffer({ size: n * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const e = device.createCommandEncoder(); e.copyBufferToBuffer(b, 0, st, 0, n * 4); device.queue.submit([e.finish()]);
    await st.mapAsync(GPUMapMode.READ); const o = Float32Array.from(new Float32Array(st.getMappedRange())); st.unmap(); st.destroy(); return o; };
  const rel = (a, b) => { let n = 0, d = 0; for (let i = 0; i < a.length; i++) { n += (a[i] - b[i]) ** 2; d += b[i] ** 2; } return Math.sqrt(n / d); };
  const out = [];
  for (const kind of Q8 ? ["q4", "q8"] : ["q4"]) for (const shape of SH) {
    const [dOut, dIn] = shape.split("x").map(Number), Sp = GEMM_S[shape], nb = dIn / 32, xs = Math.ceil(dIn / 64) * 64, ys = Math.ceil(dOut / 64) * 64;
    const qs = buf(Uint32Array.from({ length: dOut * nb * (kind === "q8" ? 8 : 4) }, () => (Math.random() * 2 ** 32) >>> 0));
    const sc = buf(Uint32Array.from({ length: dOut * nb / 2 }, () => f32ToF16(0.005 + Math.random() * 0.03) | (f32ToF16(0.005 + Math.random() * 0.03) << 16)));
    const x = buf(Float32Array.from({ length: N * xs }, () => Math.random() * 2 - 1));
    const shp = buf(new Uint32Array([dOut, dIn, xs / 4, ys]), U);
    const xT = device.createBuffer({ size: dIn * N * 4, usage: S }), xTh = device.createBuffer({ size: dIn * N * 4, usage: S });
    const part = device.createBuffer({ size: Sp * N * dOut * 4, usage: S }), y = device.createBuffer({ size: N * ys * 4, usage: S });
    const wgs = Math.ceil(dOut / GEMM_TILE) * Sp, red = [await pipe(main, `gemm_red_s${Sp}`), bg1(part, sc, sc, y, shp), Math.ceil(N * dOut / 64)];
    const xp = [await pipe(main, "gemm_xpose"), bg1(x, sc, sc, xT, shp), Math.ceil(dIn * N / 64)];
    const xph = [await pipe(main, "gemm_xpose_r16"), bg1(x, sc, sc, xTh, shp), Math.ceil(dIn * N / 64)];
    const flops = 2 * dOut * dIn * N, r = { kind, shape };
    const variant = async (name, steps) => {
      const ms = await time(steps);
      const e = device.createCommandEncoder(), ps = e.beginComputePass(); for (const s of [...steps, red]) disp(ps, ...s); ps.end(); device.queue.submit([e.finish()]);
      r[name] = { ms: +ms.toFixed(3), tflops: +(flops / ms / 1e9).toFixed(2), y: await read(y, N * ys) };
    };
    await variant("f32", [xp, [await pipe(main, `gemm_${kind}_${dIn}_s${Sp}`), bg1(qs, sc, xT, part, shp), wgs]]);
    await variant("f16", [xph, [await pipe(main, `gemm_${kind}_${dIn}_s${Sp}_r16`), bg1(qs, sc, xTh, part, shp), wgs]]);
    if (sgmMod && dOut % T.TM === 0) await variant("sgm", [xp, [await pipe(sgmMod, `gemm_sgm_${kind}_${dIn}_s${Sp}`), bg1(qs, sc, xT, part, shp), dOut / T.TM * Sp]]);
    const line = { kind, shape, S: Sp };
    for (const v of ["f32", "f16", "sgm"]) if (r[v]) line[v] = `${r[v].ms} ms ${r[v].tflops} TF${v === "f32" ? "" : ` rel ${rel(r[v].y, r.f32.y).toExponential(2)}`}`;
    log(JSON.stringify(line)); out.push(line);
    for (const b of [qs, sc, x, shp, xT, xTh, part, y]) b.destroy();
  }
  if (errs.length) log("GPU errors: " + errs.slice(0, 3).join(" | "));
  window.RESULT = out;
} catch (e) { log("ERROR " + (e.stack || e)); window.RESULT = { error: String(e) }; }
</script>
